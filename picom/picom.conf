# ===================
# Backend Settings
# ===================
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;

# ===================
# Opacity Settings
# ===================
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;

opacity-rule = [
    "90:class_g = 'Alacritty'",
    "90:class_g = 'ghostty'",
    "85:class_g = 'Rofi'",
    "95:class_g = 'Slack'",
    "95:class_g = 'discord'",
    "100:class_g = 'Brave-browser'",
    "100:class_g = 'firefox'",
    "100:fullscreen"
];

# ===================
# Blur Settings
# ===================
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ===================
# Fading Settings
# ===================
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = false;

fade-exclude = [];

# ===================
# Corner Settings
# ===================
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ===================
# Shadow Settings
# ===================
shadow = true;
shadow-radius = 14;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.3;
shadow-color = "#2E3440";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ===================
# Animation Settings (if using picom-animations fork)
# ===================
# animations = true;
# animation-stiffness = 200;
# animation-window-mass = 0.5;
# animation-dampening = 20;
# animation-clamping = false;

# ===================
# Other Settings
# ===================
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
vsync = true;
dbe = false;
unredir-if-possible = false;
focus-exclude = [];
detect-transient = true;
detect-client-leader = true;

# ===================
# Window type settings
# ===================
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
