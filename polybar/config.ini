;==========================================================
;   Nord Polybar Config
;==========================================================

[colors]
nord0 = #2E3440
nord1 = #3B4252
nord2 = #434C5E
nord3 = #4C566A
nord4 = #D8DEE9
nord5 = #E5E9F0
nord6 = #ECEFF4
nord7 = #8FBCBB
nord8 = #88C0D0
nord9 = #81A1C1
nord10 = #5E81AC
nord11 = #BF616A
nord12 = #D08770
nord13 = #EBCB8B
nord14 = #A3BE8C
nord15 = #B48EAD

background = #b02E3440
background-alt = #4C566A
foreground = ${colors.nord4}
foreground-dim = ${colors.nord3}

;==========================================================
; BAR
;==========================================================

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 48pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0

border-size = 0
border-color = #00000000

padding-left = 0
padding-right = 2

module-margin = 1

font-0 = "JetBrains Mono:style=Medium:size=16;4"
font-1 = "JetBrainsMono Nerd Font:size=22;5"
font-2 = "JetBrainsMono Nerd Font:size=16;4"
font-3 = "Noto Sans CJK JP:style=Medium:size=16;4"

modules-left = workspaces
modules-center = xwindow
modules-right = docker k8s cpu memory bluetooth network-wired audio-output audio-input volume date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position = none

wm-restack = i3

;==========================================================
; SEPARATORS
;==========================================================

[module/sep]
type = custom/text
content = " "

[module/sep2]
type = custom/text
content = "  "

[module/tray-spacer]
type = custom/text
content = " "

;==========================================================
; LEFT MODULES
;==========================================================

[module/workspaces]
type = internal/i3
format = <label-state><label-mode>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = true
pin-workspaces = true

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.nord0}
label-mode-background = ${colors.nord11}

; Focused
label-focused = " %{T2}%{T-} %index% "
label-focused-foreground = ${colors.nord8}
label-focused-background = ${colors.background-alt}

; Unfocused
label-unfocused = " %{T2}%{T-} %index% "
label-unfocused-foreground = ${colors.foreground-dim}

; Visible
label-visible = " %{T2}%{T-} %index% "
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}

; Urgent
label-urgent = " %{T2}%{T-} %index% "
label-urgent-foreground = ${colors.nord11}
label-urgent-background = ${colors.nord0}

[module/xwindow]
type = internal/xwindow
format = <label>
format-foreground = ${colors.nord14}
label = "%{T2}%{T-} %title:0:50:...%"
label-empty =

;==========================================================
; RIGHT MODULES
;==========================================================

[module/docker]
type = custom/script
exec = ~/.config/polybar/scripts/docker-status.sh
interval = 5
format = <label>
label = "%{T2}󰡨%{T-} %output%"
label-foreground = ${colors.nord8}
click-left = ghostty --class=floating-term -e bash -c 'docker ps; read -p "Press Enter to close..."'

[module/k8s]
type = custom/script
exec = ~/.config/polybar/scripts/k8s-status.sh
interval = 10
format = <label>
label = "%{T2}󱃾%{T-} %output%"
label-foreground = ${colors.nord9}
click-left = ghostty --class=floating-term -e bash -c 'kubectl get pods -A; read -p "Press Enter to close..."'

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = "%{T2}󰻠%{T-} %percentage:2%%"
label-foreground = ${colors.nord12}

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = "%{T2}󰍛%{T-} %percentage_used:2%%"
label-foreground = ${colors.nord15}

[module/bluetooth]
type = custom/text
content = "%{T2}󰂯%{T-}"
content-foreground = ${colors.nord9}
click-left = overskride

[module/network-wired]
type = internal/network
interface-type = wired
interval = 3

format-connected = <label-connected>
label-connected = "%{T2}󰈀%{T-}"
label-connected-foreground = ${colors.nord14}

format-disconnected =

# [module/network-wifi]
# type = internal/network
# interface-type = wireless
# interval = 3
#
# format-connected = <label-connected>
# label-connected = "%{T2}󰖩%{T-}"
# label-connected-foreground = ${colors.nord14}
#
# format-disconnected = <label-disconnected>
# label-disconnected = "%{T2}󰖪%{T-}"
# label-disconnected-foreground = ${colors.foreground-dim}

[module/volume]
type = internal/pulseaudio

format-volume = <ramp-volume> <bar-volume>
ramp-volume-0 = "%{T2}󰕿%{T-}"
ramp-volume-1 = "%{T2}󰖀%{T-}"
ramp-volume-2 = "%{T2}󰕾%{T-}"
ramp-volume-foreground = ${colors.nord13}

bar-volume-width = 10
bar-volume-foreground-0 = ${colors.nord14}
bar-volume-foreground-1 = ${colors.nord14}
bar-volume-foreground-2 = ${colors.nord14}
bar-volume-foreground-3 = ${colors.nord13}
bar-volume-foreground-4 = ${colors.nord13}
bar-volume-foreground-5 = ${colors.nord12}
bar-volume-foreground-6 = ${colors.nord11}
bar-volume-gradient = true
bar-volume-indicator = │
bar-volume-indicator-font = 0
bar-volume-indicator-foreground = ${colors.foreground}
bar-volume-fill = ─
bar-volume-fill-font = 0
bar-volume-empty = ─
bar-volume-empty-font = 0
bar-volume-empty-foreground = ${colors.foreground-dim}

label-muted = "%{T2}󰝟%{T-}  muted"
label-muted-foreground = ${colors.foreground-dim}

click-right = pavucontrol

[module/audio-output]
type = custom/text
content = "%{T2}󰓃%{T-}"
content-foreground = ${colors.nord14}
click-left = ~/.config/polybar/scripts/audio-switch.sh sink
click-right = pavucontrol

[module/audio-input]
type = custom/text
content = "%{T2}󰍬%{T-}"
content-foreground = ${colors.nord7}
click-left = ~/.config/polybar/scripts/audio-switch.sh source
click-right = pavucontrol

[module/date]
type = internal/date
interval = 1

date = "%A | %B %d, %Y"
time = "%H:%M:%S"

label = "%{T2}%{T-} %date% | %time%"
label-foreground = ${colors.foreground}

# [module/power]
# type = custom/text
# content = "%{T2}%{T-}"
# content-foreground = ${colors.nord11}
# content-padding = 1
# click-left = ~/.config/rofi/powermenu.sh

[module/powermenu]
type = custom/text
content = "%{T2}⏻%{T-}"
content-foreground = ${colors.nord11}
content-padding = 1
click-left = ~/.config/rofi/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true

